  <rect x="1.8" y="8.4" width="20.4" height="7.2" rx="2.2" fill="#ffd23f"/>
  <rect x="4" y="11" width="11" height="2" rx="1" fill="#3b3f45"/>
  <circle cx="17.4" cy="12" r="1.25" fill="#3b3f45"/>
  <rect x="3" y="18.4" width="11" height="2" rx="1" fill="#9aa0a6"/>
</svg>
