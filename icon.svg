<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24">
  <!-- A sentence under the ruler: the band, the line it covers, and the full
       stop that ends it. The lines above and below are the rest of the
       paragraph, which the ruler is not on. -->
